<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="prv-medal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="prv-ribbon-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="prv-ribbon-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="prv-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="prv-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="prv-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
    <filter id="prv-inner-glow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1d4ed8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Ribbon tails -->
  <path d="M22 38 L16 56 L24 50 L28 58 L30 42" fill="url(#prv-ribbon-l)" filter="url(#prv-shadow)"/>
  <path d="M42 38 L48 56 L40 50 L36 58 L34 42" fill="url(#prv-ribbon-r)" filter="url(#prv-shadow)"/>
  <!-- Ribbon tail highlights -->
  <path d="M22 38 L17.5 52 L20 49 L24 44" fill="#93c5fd" opacity="0.3"/>
  <path d="M42 38 L46.5 52 L44 49 L40 44" fill="#bfdbfe" opacity="0.25"/>
  <!-- Medal outer circle -->
  <circle cx="32" cy="28" r="18" fill="url(#prv-medal)" filter="url(#prv-shadow)"/>
  <!-- Medal rim highlight -->
  <circle cx="32" cy="28" r="16" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.5"/>
  <!-- Medal inner circle -->
  <circle cx="32" cy="28" r="13" fill="url(#prv-inner)" filter="url(#prv-inner-glow)"/>
  <!-- Inner ring -->
  <circle cx="32" cy="28" r="11" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
  <!-- Star in center -->
  <path d="M32 18 L34.5 24 L41 24.8 L36 29.5 L37.5 36 L32 33 L26.5 36 L28 29.5 L23 24.8 L29.5 24 Z" fill="url(#prv-star)" filter="url(#prv-inner-glow)"/>
  <!-- Top shine -->
  <ellipse cx="28" cy="18" rx="5" ry="3" fill="white" opacity="0.15" transform="rotate(-20 28 18)"/>
</svg>
