<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eli-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="eli-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="eli-jewel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="eli-gem-r" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </radialGradient>
    <radialGradient id="eli-gem-b" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <radialGradient id="eli-gem-g" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
    <filter id="eli-shadow">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#92400e" flood-opacity="0.45"/>
    </filter>
    <filter id="eli-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eli-sparkle">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crown body -->
  <path d="M8 44 L8 26 L18 34 L26 16 L32 28 L38 16 L46 34 L56 26 L56 44 Z" fill="url(#eli-crown)" filter="url(#eli-shadow)"/>
  <!-- Crown front highlight -->
  <path d="M10 42 L10 28 L18 34 L26 18 L32 28 L38 18 L46 34 L54 28 L54 36 L46 32 L38 42 Z" fill="#fde68a" opacity="0.25"/>
  <!-- Crown base band -->
  <rect x="8" y="44" width="48" height="8" rx="2" fill="url(#eli-band)" filter="url(#eli-shadow)"/>
  <!-- Band highlight -->
  <rect x="8" y="44" width="48" height="3" rx="1.5" fill="#fde68a" opacity="0.3"/>
  <!-- Band pattern dots -->
  <circle cx="20" cy="48" r="1.2" fill="#fde68a" opacity="0.5"/>
  <circle cx="32" cy="48" r="1.2" fill="#fde68a" opacity="0.5"/>
  <circle cx="44" cy="48" r="1.2" fill="#fde68a" opacity="0.5"/>
  <!-- Crown tip jewels -->
  <circle cx="8" cy="26" r="3" fill="url(#eli-gem-r)" filter="url(#eli-glow)"/>
  <circle cx="26" cy="16" r="3.5" fill="url(#eli-gem-b)" filter="url(#eli-glow)"/>
  <circle cx="38" cy="16" r="3.5" fill="url(#eli-gem-g)" filter="url(#eli-glow)"/>
  <circle cx="56" cy="26" r="3" fill="url(#eli-gem-r)" filter="url(#eli-glow)"/>
  <!-- Center large gem -->
  <circle cx="32" cy="28" r="4" fill="url(#eli-jewel)" filter="url(#eli-glow)"/>
  <circle cx="32" cy="28" r="2.5" fill="none" stroke="#f59e0b" stroke-width="0.6" opacity="0.6"/>
  <!-- Gem highlight -->
  <ellipse cx="31" cy="26.5" rx="1.5" ry="1" fill="white" opacity="0.5"/>
  <!-- Sparkles around crown -->
  <g filter="url(#eli-sparkle)">
    <!-- Top center sparkle -->
    <path d="M32 6 L33 9 L36 10 L33 11 L32 14 L31 11 L28 10 L31 9 Z" fill="#fde68a" opacity="0.9"/>
    <!-- Left sparkle -->
    <path d="M12 18 L12.6 20 L14.5 20.5 L12.6 21 L12 23 L11.4 21 L9.5 20.5 L11.4 20 Z" fill="#fde68a" opacity="0.7"/>
    <!-- Right sparkle -->
    <path d="M52 18 L52.6 20 L54.5 20.5 L52.6 21 L52 23 L51.4 21 L49.5 20.5 L51.4 20 Z" fill="#fde68a" opacity="0.7"/>
    <!-- Small sparkle top-left -->
    <path d="M20 8 L20.4 9.3 L21.5 9.6 L20.4 9.9 L20 11.2 L19.6 9.9 L18.5 9.6 L19.6 9.3 Z" fill="white" opacity="0.5"/>
    <!-- Small sparkle top-right -->
    <path d="M44 8 L44.4 9.3 L45.5 9.6 L44.4 9.9 L44 11.2 L43.6 9.9 L42.5 9.6 L43.6 9.3 Z" fill="white" opacity="0.5"/>
  </g>
</svg>
